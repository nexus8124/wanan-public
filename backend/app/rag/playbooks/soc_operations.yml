id: PB-GENERIC-IDS-001
title: 通用 IDS 事件与规则命中研判手册
version: "2.0"
tags: [ids, suricata, signature, alert, network]
applies_to:
  - Suricata IDS event
  - 仅含规则编号或通用分类的网络告警
required_evidence:
  - 具体 signature、分类、五元组、方向、payload、流状态和服务端响应
benign_explanations:
  - 信息类/策略类规则、协议实现差异、扫描器与正常业务载荷
decision:
  true_positive:
    - 具体签名与载荷、会话方向和主机证据共同支持攻击
  false_positive:
    - 规则语义为信息/策略提示，或可由已知业务明确解释
  pending:
    - 只有“IDS event”而没有签名与载荷时必须待查，不得猜测
response:
  - 回查原始 Suricata eve.json、flow_id、payload 和关联端点日志
