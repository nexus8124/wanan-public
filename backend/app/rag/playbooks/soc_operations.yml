id: PB-EXECUTABLE-DOWNLOAD-001
title: ELF/脚本下载与临时 HTTP 服务研判手册
version: "2.0"
tags: [elf, download, curl, wget, basehttpserver, payload, ingress-transfer]
applies_to:
  - ELF file download over HTTP
  - Python BaseHTTP ServerBanner
  - curl/wget 访问裸 IP 或异常端口
required_evidence:
  - URL、文件类型与哈希、发起进程、保存路径、执行记录和服务器归属
benign_explanations:
  - 开发测试、内部制品分发、运维脚本和受控软件部署
decision:
  true_positive:
    - 裸 IP/临时服务下载未知 ELF 后立即赋权执行，并伴随持久化或外联
  false_positive:
    - 内部受控制品、哈希签名可信、部署主体和变更单一致
  pending:
    - 只有下载或临时 HTTP 服务特征，没有文件内容、执行和归属证据
response:
  - 获取文件哈希和样本，检查落地执行、父子进程和后续网络行为
