id: PB-MAIL-AUTH-001
title: 邮件系统 Dovecot/IMAP/SMTP 认证研判手册
version: "2.0"
tags: [dovecot, imap, pop3, smtp, mail, authentication, tls]
applies_to:
  - Dovecot Authentication Success
  - imap-login / pop3-login / smtp-auth
  - 邮件客户端重复认证与 TLS 会话
required_evidence:
  - 登录结果、失败与成功序列、用户、来源地址、TLS 状态
  - 同一用户和来源的历史基线、邮件服务器角色
  - 登录后的异常进程、规则变更、邮件批量访问或横向行为
benign_explanations:
  - 邮件客户端周期性同步会形成大量成功登录
  - 同一内网地址作为 rip/lip、TLS 成功且无失败记录通常符合正常服务模式
  - 多用户在相近时间正常登录可能来自统一办公时段或连接池重连
decision:
  true_positive:
    - 大量失败后紧跟成功、跨多个账户尝试或来源与历史基线明显冲突
    - 成功后出现异常邮件导出、规则创建、凭据访问或横向行为
  false_positive:
    - 只有成功认证，用户与来源合理，TLS 正常且没有失败或攻击载荷
  pending:
    - 只有认证成功日志，但缺少账户、来源基线或登录后行为
response:
  - 核实账户所有者和客户端；确认失陷后撤销会话、重置凭据并检查邮箱规则
notes: 通用知识不能把单次成功登录直接证明为攻击，也不能仅凭同窗口其他 IDS 告警推翻正常认证事实。
---
id: PB-TLS-ANOMALY-001
title: TLS 无效握手与记录异常研判手册
version: "2.0"
tags: [tls, ssl, handshake, invalid-record, suricata, scan]
applies_to:
  - SURICATA TLS invalid handshake message
  - TLS invalid record/traffic 或 invalid record type
required_evidence:
  - 会话方向、源数量、目标服务、TLS 版本、SNI、握手阶段和返回结果
  - 同来源后续端口探测、HTTP 请求、漏洞利用或成功会话
benign_explanations:
  - TLS 版本或密码套件不兼容、明文误发到 TLS 端口
  - 健康检查、资产扫描器、中间盒和客户端实现差异
decision:
  true_positive:
    - 同一来源连续探测多个服务并伴随漏洞利用、恶意载荷或已知扫描基础设施
  false_positive:
    - 已备案扫描器或兼容性问题，模式固定且没有后续攻击行为
  pending:
    - 只有无效握手或记录异常；失败握手本身不代表 C2、入侵成功或数据外传
response:
  - 关联 NetFlow、SNI、JA3/JA4、服务端日志和同源后续行为
