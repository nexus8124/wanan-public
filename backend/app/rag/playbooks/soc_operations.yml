id: PB-DNS-ANOMALY-001
title: DNS 高熵、新域名与隧道嫌疑研判手册
version: "2.0"
tags: [dns, entropy, tunneling, biz, new-domain, beacon]
applies_to:
  - High entropy in DNS domain
  - New characters/IP/query record in DNS logs
  - .biz TLD、查询频率异常与 DNS 隧道告警
required_evidence:
  - 完整查询名、子域长度与熵、请求频率、响应码、返回地址和发起进程
  - 域名年龄/信誉、同主机历史基线、上传与下载字节比例
benign_explanations:
  - CDN、软件更新、遥测、反跟踪和云服务会使用高熵子域
  - 新域名或冷门 TLD 只能说明新颖性，不能单独证明恶意
decision:
  true_positive:
    - 长子域持续编码变化、稳定周期、大量唯一查询并关联异常进程或恶意域名
  false_positive:
    - 已知业务/更新域名，进程归属合理，查询模式与历史基线一致
  pending:
    - 只有高熵、首次出现或 TLD 规则命中，缺少进程和时序证据
response:
  - 查询 DNS、代理和端点进程，必要时暂时阻断域名并保留缓存
