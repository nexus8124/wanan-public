id: PB-EXTERNAL-IP-LOOKUP-001
title: 外网 IP 查询与 ipinfo 类域名研判手册
version: "2.0"
tags: [ipinfo, external-ip, dns, discovery, telemetry]
applies_to:
  - External IP Lookup Domain in DNS Lookup
  - ipinfo、ifconfig、icanhazip 等公网地址查询
required_evidence:
  - 发起进程、查询频率、资产角色、后续网络连接和脚本命令
benign_explanations:
  - VPN、云代理、DDNS、运维脚本和网络诊断会查询公网出口地址
decision:
  true_positive:
    - 异常脚本/载荷在执行后查询出口地址，并继续连接未知基础设施
  false_positive:
    - 已知网络组件或运维脚本周期查询，行为与资产角色一致
  pending:
    - 只有一次域名查询且没有发起进程和后续行为
response:
  - 关联 DNS 客户端进程、代理日志和查询后的目的连接
