id: PB-WEB-ACCESS-001
title: Apache/Nginx 400、403、404 与访问新颖性研判手册
version: "2.0"
tags: [apache, nginx, http, 400, 403, 404, accesslog, scanner]
applies_to:
  - Web server 400 error code
  - forbidden file/directory、异常方法、请求熵和新状态码
required_evidence:
  - 请求路径、方法、参数、User-Agent、来源、响应码和响应大小
  - 同源请求速率、路径覆盖度、应用/WAF 日志及服务端后续进程
benign_explanations:
  - 失效链接、搜索引擎、旧客户端、监控探针和安全扫描器
  - 400/403/404 表示请求失败，不能单独证明漏洞利用成功
decision:
  true_positive:
    - 多路径高频枚举或完整利用载荷，且存在服务端异常、文件落地或进程执行
  false_positive:
    - 固定探针、已备案扫描或普通失效资源访问，无后续异常
  pending:
    - 只有错误响应或请求新颖性，无法确认意图和影响
response:
  - 保留原始请求并关联 WAF、应用错误和端点进程；区分攻击尝试与利用成功
---
id: PB-SOFTWARE-UPDATE-001
title: 软件仓库、APT 与安全产品更新流量研判手册
version: "2.0"
tags: [apt, package-manager, update, repository, clamav, signature, cdn]
applies_to:
  - GNU/Linux APT User-Agent
  - ClamAV database update
  - 软件仓库、病毒库、签名和 CDN 更新流量
required_evidence:
  - 发起进程、软件签名、仓库域名、包校验值、计划任务和变更窗口
benign_explanations:
  - apt/apt-get、unattended-upgrades、ClamAV freshclam 和受控软件部署
  - 官方仓库、固定周期和签名校验成功通常是正常维护
decision:
  true_positive:
    - 更新进程或仓库被替换、签名失败、下载后出现异常执行或未知持久化
  false_positive:
    - 官方仓库与预期进程匹配，签名/哈希正确且符合维护计划
  pending:
    - 只有 User-Agent 或下载域名，缺少进程、签名和仓库校验
response:
  - 校验包来源和签名；确认供应链风险后隔离缓存并暂停分发
---
id: PB-ANOMALY-BASELINE-001
title: AMiner 新事件与频率偏差告警研判手册
version: "2.0"
tags: [aminer, anomaly, novelty, baseline, frequency, parameter]
applies_to:
  - New event type / new parameter combination
  - unusual occurrence frequencies / new characters / entropy deviation
required_evidence:
  - 基线训练窗口、首次出现时间、资产角色、事件原文和后续行为
  - 同类资产是否同步出现、变更单、发布计划和检测器历史稳定性
benign_explanations:
  - 软件升级、配置变更、新用户、新服务和业务发布会产生新事件
  - 频率变化和首次出现只代表偏离基线，不等于恶意
decision:
  true_positive:
    - 新颖性事件包含明确攻击语义，或与异常进程、外联、提权和持久化形成链条
  false_positive:
    - 能与备案变更、软件发布、正常用户或周期性基线漂移对应
  pending:
    - 只有统计异常，没有事件语义、资产上下文和影响证据
response:
  - 先解释原始事件，再决定是否扩大调查；不得依据“新”或“高熵”直接定性
---
id: PB-UNIX-SESSION-001
title: PAM/SSH Unix 会话生命周期研判手册
version: "2.0"
tags: [pam, ssh, session, login, logout, auditd, user-auth]
applies_to:
  - PAM Login session opened/closed
  - audit user_auth/user_acct/user_end/cred_acq/cred_disp
required_evidence:
  - 用户、来源、认证结果、TTY、父进程、会话时长和登录后命令
benign_explanations:
  - 正常交互登录、sudo 会话、cron、自动化运维和服务账户
  - session opened/closed 是审计生命周期事件，不是攻击结论
decision:
  true_positive:
    - 来源或用户异常且登录后出现提权、下载执行、横向或痕迹清理
  false_positive:
    - 用户、来源、时间和后续命令符合已知运维或业务模式
  pending:
    - 只有会话开关事件，没有认证链和会话内行为
response:
  - 关联 auth.log、auditd、sudo、shell history 和端点进程
---
id: PB-UNIX-PRIVILEGE-001
title: sudo、ROOT 与 UID 变化研判手册
version: "2.0"
tags: [sudo, root, uid, privilege-escalation, linux]
applies_to:
  - Successful sudo to ROOT
  - First time user executed sudo
  - User successfully changed UID
required_evidence:
  - 原用户、目标用户、TTY、命令、父进程、主机角色、变更单和后续操作
benign_explanations:
  - 管理员维护、软件安装、配置管理和自动化部署
  - 首次使用 sudo 是基线新颖性，不自动等于提权攻击
decision:
  true_positive:
    - 非授权用户、异常时间或进程执行敏感命令，并关联利用、下载或持久化
  false_positive:
    - 已授权主体在维护窗口执行可解释命令，且有审计/变更记录
  pending:
    - 只有成功 sudo/UID 变化，缺少命令和主体授权信息
response:
  - 核查 sudoers、命令审计和变更单；确认失陷后撤销会话并轮换凭据
---
id: PB-SERVICE-LIFECYCLE-001
title: Linux 服务启停与 systemd 持久化研判手册
version: "2.0"
tags: [systemd, service-start, service-stop, daemon, persistence]
applies_to:
  - service_start/service_stop 新参数组合
  - systemd unit 创建、修改与启动
required_evidence:
  - 服务名、unit 文件、ExecStart、创建主体、二进制路径、签名和变更时间
benign_explanations:
  - 软件安装升级、配置管理、系统启动和服务恢复
decision:
  true_positive:
    - 服务指向临时/用户可写路径、混淆命令或未知下载文件，且无变更依据
  false_positive:
    - 已知软件包、受控路径、配置管理主体和备案变更一致
  pending:
    - 只有服务启停或参数首次出现，没有 unit 内容和创建来源
response:
  - 导出 unit、哈希二进制并核查 journal/audit 日志
---
id: PB-SYSTEM-MONITORING-001
title: CPU 与系统监控偏差研判手册
version: "2.0"
tags: [cpu, monitoring, performance, baseline, resource]
applies_to:
  - CPU value deviates from average
  - CPU value out of expected range
required_evidence:
  - 进程级资源占用、持续时间、资产角色、部署/备份窗口和历史季节性
benign_explanations:
  - 批处理、备份、编译、更新、流量高峰和监控基线过窄
decision:
  true_positive:
    - 异常资源由未知进程导致并伴随挖矿、下载执行、持久化或异常外联
  false_positive:
    - 能与正常作业或业务峰值对应，进程签名和变更记录可信
  pending:
    - 只有指标偏差，没有进程和持续时间信息
response:
  - 采集进程树、命令行、容器/任务信息和同时间窗网络行为
---
id: PB-NETWORK-SCAN-001
title: SSH、端口与 Web 路径扫描研判手册
version: "2.0"
tags: [scan, ssh-scan, port-scan, web-scan, reconnaissance]
applies_to:
  - Potential SSH Scan / insecure connection attempt
  - 同源多端口、多主机或多路径快速探测
required_evidence:
  - 唯一目标/端口/路径数量、时间密度、来源归属、成功连接与后续行为
benign_explanations:
  - 资产发现、漏洞扫描、监控和备案红队演练
decision:
  true_positive:
    - 未授权来源形成明显枚举模式，并伴随登录尝试、漏洞载荷或成功连接
  false_positive:
    - 来源属于备案扫描器，范围与时间窗口符合计划
  pending:
    - 单次连接失败或少量 404，不足以构成扫描模式
response:
  - 核对扫描白名单和资产计划；必要时限速/封禁并检查被探测服务
